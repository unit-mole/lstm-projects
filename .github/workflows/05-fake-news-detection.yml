name: 05 - Fake News Detection

on:
  push:
    branches: [main]
    paths:
      - "05-fake-news-detection/**"
      - ".github/workflows/05-fake-news-detection.yml"
  pull_request:
    branches: [main]
    paths:
      - "05-fake-news-detection/**"
      - ".github/workflows/05-fake-news-detection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-fake-news-detection

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            05-fake-news-detection/requirements.txt
            05-fake-news-detection/requirements-train.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: python -m compileall app src tests train.py

      - name: Run automated tests
        run: pytest -q

      - name: Run saved-model smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.fake_news_pipeline import FakeNewsPipeline

          pipeline = FakeNewsPipeline.load(Path("models"))
          result = pipeline.predict(
              "Officials released a statement describing the proposed policy change."
          )

          assert result.predicted_label in {"Real", "Fake"}
          assert 0.0 <= result.fake_probability <= 1.0
          assert 0.0 <= result.confidence <= 1.0
          print(
              f"Smoke test passed: {result.predicted_label}, "
              f"P(fake)={result.fake_probability:.4f}"
          )
          PY

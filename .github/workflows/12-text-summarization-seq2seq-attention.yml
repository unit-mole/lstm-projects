name: 12 - Text Summarization Seq2Seq Attention CI

on:
  push:
    branches: [main]
    paths:
      - "12-text-summarization-seq2seq-attention/**"
      - ".github/workflows/12-text-summarization-seq2seq-attention.yml"
  pull_request:
    branches: [main]
    paths:
      - "12-text-summarization-seq2seq-attention/**"
      - ".github/workflows/12-text-summarization-seq2seq-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-and-smoke-test:
    name: Validate, test, and smoke-test summarizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 12-text-summarization-seq2seq-attention
    env:
      KERAS_BACKEND: jax
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            12-text-summarization-seq2seq-attention/requirements.txt
            12-text-summarization-seq2seq-attention/requirements-dev.txt
            12-text-summarization-seq2seq-attention/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall src app tests scripts train_model.py

      - name: Validate required project artifacts
        run: python scripts/validate_project.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run saved-model inference smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from src.config import SAMPLE_ARTICLES_PATH
          from src.summarization_inference import Summarizer

          sample = pd.read_csv(SAMPLE_ARTICLES_PATH).iloc[0]
          summarizer = Summarizer()
          result = summarizer.summarize(
              sample["input_text"],
              decoding_method="greedy",
              include_attention=True,
          )

          assert result.summary.strip(), "Generated summary is empty."
          assert result.summary_word_count > 0
          assert result.attention_matrix is not None
          assert result.attention_matrix.shape[0] == len(result.generated_tokens)
          assert result.attention_matrix.shape[1] == len(result.source_tokens)
          print("Saved-model smoke test passed.")
          print("Generated summary:", result.summary)
          print("Attention shape:", result.attention_matrix.shape)
          PY

      - name: Verify Streamlit installation
        run: |
          python - <<'PY'
          import streamlit
          print("Streamlit version:", streamlit.__version__)
          PY

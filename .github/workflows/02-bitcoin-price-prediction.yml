name: Bitcoin Price Prediction CI

on:
  push:
    branches: [main]
    paths:
      - "02-bitcoin-price-prediction/**"
      - ".github/workflows/02-bitcoin-price-prediction.yml"
  pull_request:
    branches: [main]
    paths:
      - "02-bitcoin-price-prediction/**"
      - ".github/workflows/02-bitcoin-price-prediction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-bitcoin-price-prediction

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-bitcoin-price-prediction/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate project artifacts
        run: python scripts/validate_project.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q app src scripts tests train_model.py
